<section class="page-header">
  <div class="page-header__bg" aria-hidden="true"></div>
  <div class="container page-header__inner">
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <ol class="breadcrumbs__list">
        <li class="breadcrumbs__item"><a class="breadcrumbs__link" href="/index.html">Главная</a></li>
        <li class="breadcrumbs__item" aria-current="page">{=$current}</li>
      </ol>
    </nav>
    <p class="eyebrow" data-reveal>{=$eyebrow}</p>
    <h1 class="page-header__title" data-reveal>{=$title}</h1>
    <p class="lead page-header__subtitle" data-reveal>{=$subtitle}</p>
  </div>
</section>
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Главная", "item": "https://russkiy-mayak.ru/" },
      { "@type": "ListItem", "position": 2, "name": "{=$current}" }
    ]
  }
</script>
